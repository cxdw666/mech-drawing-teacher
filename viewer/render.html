<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粘贴立体描述 → 三维模型</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/","three-mesh-bvh":"./vendor/jsm/three-mesh-bvh.module.js"}}</script>
<style>
:root{--cy:#35e0ff}*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 30%,#0a1a26,#050b12 55%,#010306);color:#cfe8f5;font-family:Consolas,"Microsoft YaHei",monospace;height:100vh;display:flex;flex-direction:column}
header{padding:14px 20px;border-bottom:1px solid rgba(53,224,255,.18);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:15px;color:#fff;letter-spacing:1.2px}h1::before{content:"▮ ";color:var(--cy)}
small{color:#6d94a8;font-size:11.5px}
#wrap{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%}
#panel{position:absolute;inset:0;background:rgba(4,10,16,.94);display:flex;flex-direction:column;gap:10px;padding:18px;overflow:auto}
#panel.hide{display:none}
textarea{flex:1;min-height:180px;background:#061420;color:#bfe9ff;border:1px solid rgba(53,224,255,.3);font-family:Consolas,monospace;font-size:12.5px;padding:12px;line-height:1.6}
button{cursor:pointer;font-family:inherit;font-size:13px;color:var(--cy);background:rgba(6,16,26,.9);border:1px solid rgba(53,224,255,.35);padding:10px 18px;letter-spacing:1px}
button:hover{background:rgba(53,224,255,.15);box-shadow:0 0 16px rgba(53,224,255,.35)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#msg{font-size:12px;color:#8fb6cc;white-space:pre-wrap}
#msg.err{color:#ff8b7a}
#bars{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:8px}
#bars button{min-width:140px;text-align:left}
</style></head><body>
<header><h1>粘贴立体描述 · 即时三维</h1>
<small>把豆包/模型给出的 JSON 贴进来 → 出可旋转模型 → 地址栏那条链接可以直接发人</small></header>
<div id="wrap"><canvas id="cv"></canvas>
<div id="panel">
  <div class="row"><button id="go">渲染</button><button id="demo">载入示例</button><button id="copy">复制分享链接</button><span id="msg">支持本项目的 solids/bounds 格式，也兼容 type/radius/subtractions 等别名。</span></div>
  <textarea id="ta" placeholder='{"solids":[{"op":"base","shape":"cylinder","r":30,"h":80,"pos":[0,40,0]},{"op":"sub","shape":"cylinder","r":15,"h":84,"pos":[0,40,0]}],"bounds":{"min":[-35,-4,-35],"max":[35,84,35]}}'></textarea>
</div>
<div id="bars" hidden><button id="iso">等轴测</button><button id="front">主视方向</button><button id="top">俯视方向</button><button id="left">左视方向</button><button id="auto">自动旋转</button><button id="edit">改 JSON</button></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments_RoomEnvironment.js";
import { Brush, Evaluator, SUBTRACTION, ADDITION } from "three/addons/three-bvh-csg.module.js";

const cv = document.getElementById("cv"), panel = document.getElementById("panel"), msg = document.getElementById("msg");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x060b13, 380, 1300);
const camera = new THREE.PerspectiveCamera(36, 1, 0.5, 6000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
scene.add(new THREE.HemisphereLight(0x9fe8ff, 0x061019, 1.25));
const key = new THREE.DirectionalLight(0xffffff, 2.9); key.position.set(160,300,210); scene.add(key);
const rim = new THREE.DirectionalLight(0x35e0ff, 2.2); rim.position.set(-220,120,-180); scene.add(rim);
const fill = new THREE.DirectionalLight(0x2a6cff, 1.1); fill.position.set(-120,-120,160); scene.add(fill);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1,1), 0.32, 0.55, 0.9));
composer.addPass(new OutputPass());
const controls = new OrbitControls(camera, cv);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.15;

function normalize(raw) {
  const out = Object.assign({}, raw);
  const b = raw.bounds;
  if (Array.isArray(b) && b.length === 6) out.bounds = { min: [b[0],b[1],b[2]], max: [b[3],b[4],b[5]] };
  const fold = (arr, op) => (arr || []).map(x => Object.assign({}, x, { op }));
  const all = [].concat(raw.solids || [], fold(raw.subtractions||raw.cuts||raw.removals,"sub"), fold(raw.additions||raw.adds||raw.bosses,"add"));
  out.solids = all.map(s => {
    const o = Object.assign({}, s);
    o.shape = s.shape || s.type || "box";
    if (s.radius !== undefined && s.r === undefined) o.r = s.radius;
    if (s.height !== undefined && s.h === undefined) o.h = s.height;
    o.op = s.op === "subtract" ? "sub" : s.op === "union" ? "add" : (s.op || "base");
    return o;
  });
  return out;
}

let group = null, center = new THREE.Vector3(), radius = 50;
function clear() { if (group) { scene.remove(group); group.traverse(o => { if (o.geometry) o.geometry.dispose(); }); } group = new THREE.Group(); scene.add(group); }

function build(specIn) {
  const spec = normalize(specIn);
  if (!spec.solids || !spec.solids.length) throw new Error("缺少 solids 数组");
  clear();
  const mat = new THREE.MeshPhysicalMaterial({ color: 0x1a5f80, metalness: 0.32, roughness: 0.34, clearcoat: 0.85, clearcoatRoughness: 0.2, envMapIntensity: 1.05, side: THREE.DoubleSide });
  const ev = new Evaluator(); ev.useGroups = false;
  let acc = null;
  for (const s of spec.solids) {
    let g;
    if (s.shape === "cylinder") g = new THREE.CylinderGeometry(s.r, s.r, s.h, 96, 1);
    else if (s.shape === "box") g = new THREE.BoxGeometry(s.size[0], s.size[1], s.size[2]);
    else throw new Error("不支持的基本体: " + s.shape);
    const b = new Brush(g, mat);
    b.position.set(s.pos[0], s.pos[1], s.pos[2]);
    if (s.rotation) b.rotation.set(s.rotation[0]*Math.PI/180, s.rotation[1]*Math.PI/180, s.rotation[2]*Math.PI/180);
    b.updateMatrixWorld();
    if (!acc) { acc = b; continue; }
    acc = ev.evaluate(acc, b, s.op === "sub" ? SUBTRACTION : ADDITION);
  }
  const mesh = new THREE.Mesh(acc.geometry, mat);
  mesh.geometry.computeVertexNormals();
  group.add(mesh);
  acc.geometry.computeBoundingBox();
  const bb = acc.geometry.boundingBox;
  bb.getCenter(center); const size = bb.getSize(new THREE.Vector3());
  radius = size.length() * 0.5;
  const grid = new THREE.GridHelper(Math.ceil(radius*8), 24, 0x2aa9c8, 0x0e3346);
  grid.position.set(center.x, bb.min.y - 0.6, center.z);
  grid.material.transparent = true; grid.material.opacity = 0.5;
  group.add(grid);
  controls.target.copy(center);
  camera.position.set(center.x + radius*3.1, center.y + radius*2.2, center.z + radius*2.8);
  camera.near = radius*0.02; camera.far = radius*40; camera.updateProjectionMatrix();
  controls.update();
  return spec;
}

function fit() { const w = cv.clientWidth, h = cv.clientHeight; renderer.setSize(w,h,false); composer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
window.addEventListener("resize", fit);
(function loop(){ requestAnimationFrame(loop); controls.update(); composer.render(); })();

function b64enc(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64dec(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); return decodeURIComponent(escape(atob(s))); }

const ta = document.getElementById("ta");
function run(text, pushUrl) {
  try {
    const spec = build(JSON.parse(text));
    panel.classList.add("hide"); document.getElementById("bars").hidden = false;
    msg.className = ""; msg.textContent = "渲染成功。拖动旋转、滚轮缩放。";
    fit();
    if (pushUrl) { history.replaceState(null, "", "#d=" + b64enc(JSON.stringify(spec))); }
  } catch (e) { msg.className = "err"; msg.textContent = "渲染失败：" + e.message; panel.classList.remove("hide"); }
}
document.getElementById("go").onclick = () => run(ta.value, true);
document.getElementById("demo").onclick = () => { ta.value = JSON.stringify({solids:[{op:"base",shape:"cylinder",r:30,h:80,pos:[0,40,0]},{op:"sub",shape:"cylinder",r:15,h:84,pos:[0,40,0]},{op:"sub",shape:"cylinder",r:6,h:66,pos:[0,40,0],rotation:[90,0,0]}],bounds:{min:[-35,-4,-35],max:[35,84,35]}}, null, 2); };
document.getElementById("copy").onclick = async () => { await navigator.clipboard.writeText(location.href); msg.textContent = "已复制当前链接（含模型数据），可直接发给别人。"; };
document.getElementById("edit").onclick = () => { panel.classList.remove("hide"); document.getElementById("bars").hidden = true; };
document.getElementById("iso").onclick = () => { controls.autoRotate = true; camera.position.set(center.x+radius*3.1, center.y+radius*2.2, center.z+radius*2.8); controls.target.copy(center); };
document.getElementById("front").onclick = () => { controls.autoRotate=false; camera.position.set(center.x, center.y, center.z+radius*4.2); controls.target.copy(center); };
document.getElementById("top").onclick = () => { controls.autoRotate=false; camera.position.set(center.x, center.y+radius*4.2, center.z+0.01); controls.target.copy(center); };
document.getElementById("left").onclick = () => { controls.autoRotate=false; camera.position.set(center.x-radius*4.2, center.y, center.z); controls.target.copy(center); };
document.getElementById("auto").onclick = () => { controls.autoRotate = !controls.autoRotate; };

const h = location.hash;
if (h.startsWith("#d=")) { try { const t = b64dec(h.slice(3)); ta.value = t; run(t, false); } catch (e) { msg.className="err"; msg.textContent = "链接里的数据解析失败：" + e.message; } }
fit();
</script></body></html>
